<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Gerador de Temas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f0ff;
      color: #2d2d3a;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 { font-size: 1.8rem; color: #6c63ff; }
    p.desc { color: #7a7a9d; font-size: 0.95rem; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(108,99,255,0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label { font-weight: 700; font-size: 0.9rem; color: #6c63ff; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #d0d0f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #6c63ff; }
    .pair-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pair-row input { flex: 1; }
    .btn-remove {
      background: #ff6584;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .btn-remove:hover { background: #e0304f; }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-add {
      background: linear-gradient(135deg, #06d6a0, #118ab2);
      color: #fff;
      box-shadow: 0 4px 14px rgba(6,214,160,0.35);
    }
    .btn-gen {
      background: linear-gradient(135deg, #6c63ff, #118ab2);
      color: #fff;
      box-shadow: 0 4px 14px rgba(108,99,255,0.4);
      font-size: 1.1rem;
    }
    .output-block {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 12px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      white-space: pre;
      overflow-x: auto;
      line-height: 1.6;
    }
    .btn-copy-output {
      background: #ffd166;
      color: #2d2d3a;
      align-self: flex-start;
    }
    .hint {
      background: rgba(108,99,255,0.08);
      border-left: 4px solid #6c63ff;
      padding: 12px 16px;
      border-radius: 0 10px 10px 0;
      font-size: 0.9rem;
      color: #2d2d3a;
      line-height: 1.5;
    }
    #pairs-container { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">

    <div>
      <h1>🛠️ Gerador de Temas</h1>
      <p class="desc">Crie novos temas para o Jogo da Memória e cole o código gerado em <code>themes.js</code>.</p>
    </div>

    <div class="hint">
      💡 <strong>Como usar:</strong> preencha o nome e os emojis do tema, clique em "Gerar Código",
      copie o bloco gerado e cole dentro do objeto <code>THEMES</code> em <code>themes.js</code>.
    </div>

    <div class="card">
      <div>
        <label>🔑 Chave do tema (sem espaços, ex: <code>frutas</code>)</label>
        <input type="text" id="theme-key" placeholder="frutas" maxlength="30"
               pattern="[a-z0-9_]+" autocomplete="off" autocapitalize="none" />
      </div>
      <div>
        <label>🏷️ Rótulo exibido no menu (ex: 🍓 Frutas)</label>
        <input type="text" id="theme-label" placeholder="🍓 Frutas" autocomplete="off" />
      </div>

      <label>🎴 Pares de emojis (mínimo 4, ideal 8)</label>
      <div id="pairs-container"></div>

      <button class="btn btn-add" id="btn-add-pair">＋ Adicionar Emoji</button>
    </div>

    <button class="btn btn-gen" id="btn-generate">⚡ Gerar Código</button>

    <div class="card" id="output-section" style="display:none;">
      <label>📋 Código gerado — cole dentro de <code>THEMES</code> em themes.js:</label>
      <pre class="output-block" id="output-code"></pre>
      <button class="btn btn-copy-output" id="btn-copy-output">📋 Copiar</button>
      <p id="copy-ok" style="color:#06d6a0;font-weight:700;min-height:1.2em;"></p>
    </div>

  </div>
  <script src="admin.js"></script>
</body>
</html>
